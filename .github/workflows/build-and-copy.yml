name: Build and Copy to Warehouse

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout inventory-dashboard
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Checkout wearehouse
        uses: actions/checkout@v4
        with:
          repository: tabrisyuen-svg/wearehouse
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: wearehouse

      - name: Copy dist to shop-sync
        run: |
          rm -rf wearehouse/shop-sync
          cp -r dist/ wearehouse/shop-sync

      - name: Push to wearehouse
        run: |
          cd wearehouse
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add shop-sync/
          git commit -m "Auto: update shop-sync from inventory-dashboard build"
          git push
